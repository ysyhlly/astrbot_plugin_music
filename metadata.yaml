name: astrbot_plugin_music
display_name: 点歌 · Netease Music
short_desc: 发一条 /点歌 歌名 [歌手]，机器人回你歌曲卡片、歌词图与网易云热评图。
desc: |
  点歌插件（Netease Music）让机器人变身点歌台。
  输入 /点歌 歌名 [歌手] 即可点歌：先发出歌曲卡片（163 / custom / share 三态可选），
  再发一张歌词图，最后发一张网易云热评图；每一张图都能单独开关、单独调样式。
  全部参数都在插件配置面板里：点歌来源（官方直连 / 自建 NeteaseCloudMusicApi）、
  卡片形态与降级策略、歌词宽度/主题/字号/行距/最大行数、评论条数与排序/头像/点赞/回复、
  冷却秒数、每日限额、群白黑名单、用户黑名单、发送间隔与调试日志。
  歌词与评论都做了三级降级（HTML -> Markdown -> 纯文本），渲染服务不可用时不会让指令
  直接失败；歌曲卡片也做了降级（拿不到播放地址时自动退化为分享卡片或文本）。
